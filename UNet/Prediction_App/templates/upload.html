<!doctype html>
<html>
<head>
    <title>Brain MRI Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        form {
            margin: 20px;
        }
        input[type="file"] {
            padding: 10px;
            margin: 10px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Upload Brain MRI NIfTI (.nii/.nii.gz)</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".nii,.nii.gz" required><br>
        <input type="submit" value="Upload and Analyze">
    </form>
</body>
</html>
